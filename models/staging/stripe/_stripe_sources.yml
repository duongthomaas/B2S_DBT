version: 2

sources:
  - name: stripe
    description: "Data to do with payments our toasted sandwich shop"
    database: raw
    config:
      freshness:
        warn_after:
          count: 5
          period: hour
        error_after:
          count: 24
          period: hour

    tables:
      - name: payment
        description: ""
        columns:
          - name: id
            data_type: number
            description: "Unique indetifier"
            data_tests:
              - unique
              - not_null

          - name: orderid
            data_type: number
            description: "Unique identifier of order"
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    field: id
                    to: source('jaffle_shop', 'orders')

          - name: paymentmethod
            data_type: varchar
            description: "Payment method"
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                     - credit_card
                     - bank_transfer
                     - gift_card
                     - coupon

          - name: status
            data_type: varchar
            description: "Status of transaction"
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - success
                      - fail

          - name: amount
            data_type: number
            description: "Amount paid"
            data_tests:
              - not_null

          - name: created
            data_type: date
            description: "Date payment made"
            data_tests:
              - not_null
              
          - name: _batched_at
            data_type: timestamp_ntz
            description: "System generated timestamp"
