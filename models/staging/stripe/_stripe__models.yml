
version: 2

models:
  - name: stg_stripe__payment
    description: "Staging layer of payment data"
    columns:
      - name: id
        data_type: number
        description: "Unique identifier"

      - name: orderid
        data_type: number
        description: "Unique identifier of order id"

      - name: paymentmethod
        data_type: varchar
        description: "Payment method"

      - name: status
        data_type: varchar
        description: "Status of payment"

      - name: amount
        data_type: number
        description: "Amount paid"
        data_tests:
          - not_null
          - no_negative_values

      - name: created
        data_type: date
        description: "Date of payment"

      - name: _batched_at
        data_type: timestamp_ntz
        description: "Timestamp"
